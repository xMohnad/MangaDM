[project]
name = "MangaDM"
version = "0.7.0"
description = "A tool for downloading manga."
authors = [{ name = "xMohnad" }]

dependencies = [
  "aiohttp>=3.12.13",
  "dacite>=1.9.2",
  "ebooklib>=0.19",
  "pyyaml>=6.0.2",
  "rich>=14.0.0",
  "typer>=0.19.2",
]

readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

classifiers = [
  "Environment :: Console",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Terminals",
  "Typing :: Typed",
]

keywords = ["terminal"]

[project.urls]
Homepage = "https://github.com/xMohnad/MangaDM"
Repository = "https://github.com/xMohnad/MangaDM"
Issues = "https://github.com/xMohnad/MangaDM/issues"

[tool.uv]
package = true

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["uv_build>=0.11.30,<0.12"]
build-backend = "uv_build"

[project.scripts]
mangadm = "mangadm.cli:app"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["D", "F", "I", "B", "UP", "ISC", "TC", "SIM"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
typeCheckingMode = "standard"
